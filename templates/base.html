<!doctype html>
<html>
<head>
    <title>Campus Notes</title>
</head>
<body>
    <h1>Campus Notes</h1>
    {% if session.user_id %}
    <p><a href="{{ url_for('notes.index') }}">My notes</a> | <a href="{{ url_for('auth.logout') }}">Log out</a></p>
    {% endif %}
    {% for message in get_flashed_messages() %}
    <p><strong>{{ message }}</strong></p>
    {% endfor %}
    {% block content %}{% endblock %}
</body>
</html>
